<!doctype html>
<html lang="zh-CN">
<head>

  <title>genai-bench · 单人版</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" onclick="GB.go('/#/new')">
        <span class="logo">GB</span>
        <span class="brand-name">genai-bench <em>单人版</em></span>
      </div>
      <nav class="nav">
        <a data-nav="new" href="/#/new">新建实验</a>
        <a data-nav="history" href="/#/history">历史结果</a>
